</head>

            stroke="#92400e" stroke-width="0.8" opacity="0.6"/>
      <path d="M31 14 L22 12.5 M31 18 L22 16.5 M31 22 L22 20.5 M31 26 L22 24.5"

  <button class="top-nav-user" id="userMenuBtn" type="button" aria-label="User menu">
    <span class="user-avatar" id="userAvatar">?</span>
    <span class="user-name" id="userNameTop">Student</span>
  </button>
</nav>

<main class="container">

  <section class="page-head">
    <div class="section-label">Rankings</div>
    <h1 class="page-title">Leaderboard</h1>
    <p class="page-sub">See how you rank against students across the country.</p>
  </section>

  <!-- Time filter tabs -->
  <div class="leaderboard-tabs" role="tablist">
    <button class="lb-tab active" data-timeframe="all" type="button" role="tab">All Time</button>
    <button class="lb-tab" data-timeframe="month" type="button" role="tab">This Month</button>
    <button class="lb-tab" data-timeframe="week" type="button" role="tab">This Week</button>
  </div>

  <!-- Curriculum filter chips -->
  <div class="filter-bar">
    <button class="chip active" data-curriculum="all" type="button">🌍 All</button>
    <button class="chip" data-curriculum="844" type="button">8-4-4</button>
    <button class="chip" data-curriculum="CBE" type="button">CBE</button>
  </div>

  <!-- My rank card -->
  <div id="myRankCard" class="my-rank-card hidden">
    <div class="my-rank-left">
      <div class="user-avatar" id="myRankAvatar">?</div>
      <div style="min-width: 0;">
        <div style="font-size: 12px; color: var(--text-mute); margin-bottom: 2px;">Your Position</div>
        <div class="my-rank-name" id="myRankName">Loading…</div>
      </div>
    </div>
    <div class="my-rank-right">
      <div class="my-rank-value" id="myRankValue">#—</div>
      <div class="my-rank-score" id="myRankScore">0 pts</div>
    </div>
  </div>

  <!-- Leaderboard list -->
  <div id="lbList" class="lb-list">
    <div class="loading-wrap">
      <div class="spinner spinner-lg"></div>
      <div>Loading rankings…</div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="app-footer">
    <div class="footer-left">
      <span class="footer-bulb">💡</span>
      <span>Better grades. Brighter future.</span>
    </div>
    <div class="footer-right">
      <span>WeGEM Learning</span>
      <span class="dot-sep">|</span>
      <span>For a smarter Kenya</span>
      <span class="flag-mini"></span>
    </div>
  </footer>

</main>

<script type="module" src="js/pages/leaderboard.js"></script>
</body>
</html>
