<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes — WeGEM Learning</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="top-nav">
  <a href="home.html" class="top-nav-brand">
    <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" class="brand-mark-mini">
      <path d="M6 10 L18 8 L20 12 L22 8 L34 10 L34 30 L22 32 L20 28 L18 32 L6 30 Z"
            fill="#fbbf24" stroke="#f59e0b" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M20 12 L20 28" stroke="#f59e0b" stroke-width="1.2"/>
      <path d="M9 14 L18 12.5 M9 18 L18 16.5 M9 22 L18 20.5 M9 26 L18 24.5"
            stroke="#92400e" stroke-width="0.8" opacity="0.6"/>
      <path d="M31 14 L22 12.5 M31 18 L22 16.5 M31 22 L22 20.5 M31 26 L22 24.5"
            stroke="#92400e" stroke-width="0.8" opacity="0.6"/>
    </svg>
    <span>WeGEM Learning</span>
  </a>

  <div class="top-nav-links">
    <a href="home.html"><span>🏠</span><span>Home</span></a>
    <a href="notes.html" class="active"><span>📖</span><span>Notes</span></a>

  <button class="top-nav-user" id="userMenuBtn" type="button">
    <span class="user-avatar" id="userAvatar">E</span>
    <span class="user-name" id="userNameTop">Edwin</span>
  </button>
</nav>

<!-- ==================== MAIN ==================== -->
<main class="container">

  <section class="page-head">
    <div class="section-label">Study Material</div>
    <h1 class="page-title">Notes</h1>
    <p class="page-sub">
      Browse long-form notes organized by subject. Tap any card to read the full pages.
    </p>
  </section>

  <!-- Search -->
  <div class="topbar-search" style="margin-bottom:16px;max-width:420px;position:relative;">
    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/>
      <path d="M20 20 L16.5 16.5"/>
    </svg>
    <input type="text" id="notesSearch" placeholder="Search notes by topic or subject...">
  </div>

  <!-- Subject chips -->
  <div id="subjectFilterBar" class="filter-bar"></div>

  <!-- SECTION A: LONG-FORM CANVAS NOTES (from Firebase) -->
  <section class="notes-section-block">
    <div class="panel-head-inline">
      <div class="panel-title-lg">📚 Long-Form Notes</div>
      <div class="pill-tag" id="canvasCount">0</div>
    </div>
    <div id="canvasList" class="canvas-list"></div>
  </section>

  <!-- SECTION B: SHORT NOTES / QUICK CARDS (static + authored) -->
  <section class="notes-section-block" style="margin-top:28px;">
    <div class="panel-head-inline">
      <div class="panel-title-lg">⚡ Quick Notes</div>
      <div class="pill-tag" id="quickCount">0</div>
    </div>
    <div id="notesList" class="notes-list-v2"></div>
  </section>

  <footer class="app-footer">
    <div class="footer-left">
      <span class="footer-bulb">💡</span>
      <span>Better grades. Brighter future.</span>
    </div>
    <div class="footer-right">
      <span>WeGEM Learning</span>
      <span class="dot-sep">|</span>
      <span>For a smarter Kenya</span>
      <span class="flag-mini"></span>
    </div>
  </footer>

</main>

<!-- ==================== TOAST ==================== -->
<div id="toast" class="toast hidden"></div>

<script type="module" src="js/notes.js"></script>
</body>
</html>
