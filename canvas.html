<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas — WeGEM Learning</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="canvas-body">

<!-- ==================== CANVAS TOP BAR ==================== -->
<header class="canvas-topbar">
  <button class="canvas-back" id="backBtn" type="button" title="Back">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12 H5 M12 19 L5 12 L12 5"/>
    </svg>
  </button>

  <div class="canvas-title-wrap">
    <div class="canvas-mode-label" id="modeLabel">Notes</div>
    <input type="text" class="canvas-title-input" id="titleInput"
           placeholder="Untitled document" readonly>
  </div>

  <div class="canvas-actions">
    <!-- View mode: page navigation -->
    <div class="canvas-page-nav" id="pageNav">
      <button class="canvas-nav-btn" id="prevBtn" type="button" title="Previous page">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 6 L9 12 L15 18"/>
        </svg>
      </button>
      <span class="canvas-page-counter">
        <span id="pageCurrent">1</span> / <span id="pageTotal">1</span>
      </span>
      <button class="canvas-nav-btn" id="nextBtn" type="button" title="Next page">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 6 L15 12 L9 18"/>
        </svg>
      </button>
    </div>

    <!-- Edit mode buttons (hidden until edit enabled) -->
    <button class="canvas-action-btn canvas-action-save hidden" id="saveBtn" type="button">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21 H5 A2 2 0 0 1 3 19 V5 A2 2 0 0 1 5 3 H16 L21 8 V19 A2 2 0 0 1 19 21 Z"/>
        <path d="M17 21 V13 H7 V21 M7 3 V8 H15"/>
      </svg>
      Save
    </button>

    <button class="canvas-action-btn canvas-action-add hidden" id="addPageBtn" type="button">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
        <path d="M12 5 V19 M5 12 H19"/>
      </svg>
      Add Page
    </button>

    <!-- Edit toggle (view mode) -->
    <button class="canvas-action-btn canvas-action-edit" id="editToggleBtn" type="button">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20 H21 M16.5 3.5 A2.121 2.121 0 0 1 19.5 6.5 L7 19 L3 20 L4 16 L16.5 3.5 Z"/>
      </svg>
      <span id="editToggleText">Edit</span>
    </button>

    <!-- Cancel editing -->
    <button class="canvas-action-btn canvas-action-cancel hidden" id="cancelBtn" type="button">
      Cancel
    </button>
  </div>
</header>

<!-- ==================== CANVAS STAGE ==================== -->
<main class="canvas-stage" id="canvasStage">

  <!-- Paginated pages container -->
  <div class="canvas-pages" id="pagesContainer">

    <!-- Pages are rendered by JS -->
    <div class="canvas-page" data-page="0">
      <div class="canvas-page-number">1</div>
      <div class="canvas-page-content" data-page-content="0">
        <!-- Content injected here -->
      </div>
    </div>

  </div>

</main>

<!-- ==================== BOTTOM INFO BAR ==================== -->
<footer class="canvas-footer">
  <div class="canvas-footer-left">
    <span class="canvas-status" id="statusBadge">Read-only</span>
  </div>
  <div class="canvas-footer-right">
    <span id="wordCount">0 words</span>
    <span class="canvas-sep">·</span>
    <span id="savedAt">Not saved yet</span>
  </div>
</footer>

<!-- ==================== PASSWORD MODAL ==================== -->
<div id="passwordModal" class="modal-backdrop hidden">
  <div class="modal-card" style="max-width:420px;">
    <div class="modal-head">
      <h3 class="modal-title">🔒 Enter admin password</h3>
      <button class="modal-close" id="pwCloseBtn" type="button">×</button>
    </div>

    <p style="font-size:13.5px;color:var(--text-dim);margin-bottom:18px;line-height:1.55;">
      Editing this canvas requires the admin password.
    </p>

    <div id="pwError" class="auth-error hidden"></div>

    <label class="field">
      <span>Password</span>
      <input type="password" id="pwInput" placeholder="Enter password" autocomplete="off">
    </label>

    <div class="modal-actions">
      <button class="btn btn-ghost" id="pwCancelBtn" type="button">Cancel</button>
      <button class="btn btn-primary" id="pwSubmitBtn" type="button">Unlock →</button>
    </div>
  </div>
</div>

<!-- ==================== TITLE MODAL (for new canvas) ==================== -->
<div id="titleModal" class="modal-backdrop hidden">
  <div class="modal-card" style="max-width:480px;">
    <div class="modal-head">
      <h3 class="modal-title">📝 New document</h3>
      <button class="modal-close" id="titleCloseBtn" type="button">×</button>
    </div>

    <p style="font-size:13.5px;color:var(--text-dim);margin-bottom:18px;line-height:1.55;">
      Give your document a title and pick which subject it belongs to.
    </p>

    <div id="titleError" class="auth-error hidden"></div>

    <label class="field">
      <span>Title</span>
      <input type="text" id="newTitleInput" placeholder="e.g. KCSE 2023 Mathematics Paper 1">
    </label>

    <label class="field">
      <span>Subject</span>
      <select id="newSubjectSelect"></select>
    </label>

    <div class="modal-actions">
      <button class="btn btn-ghost" id="titleCancelBtn" type="button">Cancel</button>
      <button class="btn btn-primary" id="titleCreateBtn" type="button">Create →</button>
    </div>
  </div>
</div>

<!-- ==================== TOAST ==================== -->
<div id="toast" class="toast hidden"></div>

<script type="module" src="js/canvas.js"></script>
</body>
</html>
