<main class="container">

  <section class="page-head">
    <div class="section-label">Personalize</div>
    <h1 class="page-title">Wallpapers</h1>
    <p class="page-sub">
      Pick a background theme that fits your mood. Your choice is saved to this device.
    </p>
  </section>

  <!-- Category filter chips -->
  <div id="categoryBar" class="filter-bar"></div>

  <!-- Wallpaper grid -->
  <div id="wallpaperGrid" class="wallpaper-grid">
    <div class="loading-wrap" style="grid-column: 1 / -1;">
      <div class="spinner spinner-lg"></div>
      <div>Loading wallpapers…</div>
    </div>
  </div>

  <!-- Reset button -->
  <div style="margin-top: 32px; text-align: center;">
    <button class="btn btn-ghost" id="resetWallpaperBtn" type="button">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
        <path d="M3 12 A9 9 0 1 1 12 21"/>
        <path d="M3 12 L3 6 M3 12 L9 12"/>
      </svg>
      Reset to default

  </div>

    <div class="footer-left">
      <span class="footer-bulb">💡</span>
      <span>Better grades. Brighter future.</span>
