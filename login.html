<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — WeGEM Learning</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="nav">
  <a href="index.html" class="logo"><span class="logo-dot"></span> WeGEM Learning</a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="exams.html">Exams</a>
    <a href="quiz.html">Practice</a>
    <a href="progress.html">Progress</a>
  </div>
</nav>

<main class="container">
  <div class="auth-card">
    <div class="section-label">Welcome</div>
    <h1 class="section-title">Identify yourself</h1>
    <p class="section-sub">Enter your name and email so we can save your quiz progress to the cloud.</p>

    <div id="authError" class="auth-error hidden"></div>

    <label>
      <span>Your name</span>
      <input type="text" id="name" placeholder="e.g. Edwin" autocomplete="name">
    </label>

    <label>
      <span>Email</span>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    </label>

    <button class="btn btn-primary" id="continueBtn">Continue →</button>

    <p class="auth-hint">
      We use this to sync your quiz progress across devices. No password needed.
    </p>
  </div>
</main>

<footer class="footer">WeGEM Learning · Interactive exam prep for Kenya</footer>

<script type="module">
  import { saveUser, setCurrentUser, makeUserId, getCurrentUser } from './js/firebase.js';

  if (getCurrentUser()) {
    window.location.href = 'index.html';
  }

  const nameEl = document.getElementById('name');
  const emailEl = document.getElementById('email');
  const errorEl = document.getElementById('authError');

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.classList.remove('hidden');
  }
  function clearError() {
    errorEl.classList.add('hidden');
    errorEl.textContent = '';
  }

  document.getElementById('continueBtn').onclick = async () => {
    clearError();

    const name = nameEl.value.trim();
    const email = emailEl.value.trim().toLowerCase();

    if (!name) { showError('Please enter your name.'); return; }
    if (!email || !email.includes('@')) { showError('Please enter a valid email.'); return; }

    const userId = makeUserId(email);

    try {
      await saveUser(userId, { email, name });
      setCurrentUser({ userId, email, name });
      window.location.href = 'index.html';
    } catch (e) {
      console.error(e);
      showError('Could not save your details. Check your connection and try again.');
    }
  };

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('continueBtn').click();
  });
</script>
</body>
</html>
