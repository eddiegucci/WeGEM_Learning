<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome — WeGEM Learning</title>
  <meta name="description" content="Interactive exam prep for Kenyan students. KCSE, KJSEA, and KPSEA practice with instant feedback.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="nav">
  <a href="login.html" class="logo"><span class="logo-dot"></span> WeGEM Learning</a>
  <div class="nav-links">
    <a href="login.html" class="active">Home</a>
    <a href="exams.html">Exams</a>
    <a href="quiz.html">Practice</a>
    <a href="progress.html">Progress</a>
  </div>
</nav>

<main class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo"><span class="logo-dot"></span> WeGEM Learning</div>

    <h1 class="auth-title">Karibu! Let's get you started.</h1>
    <p class="auth-sub">Enter your name and email to save your progress to the cloud and start practicing.</p>

    <div id="authError" class="auth-error hidden"></div>

    <label>
      <span>Your name</span>
      <input type="text" id="name" placeholder="e.g. Edwin" autocomplete="name" autofocus>
    </label>

    <label>
      <span>Email</span>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    </label>

    <button class="btn btn-primary" id="continueBtn">Continue →</button>

    <p class="auth-hint">
      No password needed. We'll use this to sync your quiz progress across devices.
    </p>
  </div>
</main>

<script type="module">
  import { saveUser, setCurrentUser, makeUserId, getCurrentUser } from './js/firebase.js';

  // If already identified, go home
  if (getCurrentUser()) {
    window.location.href = 'index.html';
  }

  const nameEl = document.getElementById('name');
  const emailEl = document.getElementById('email');
  const errorEl = document.getElementById('authError');
  const btn = document.getElementById('continueBtn');

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.classList.remove('hidden');
  }
  function clearError() {
    errorEl.classList.add('hidden');
    errorEl.textContent = '';
  }

  btn.addEventListener('click', async () => {
    clearError();

    const name = nameEl.value.trim();
    const email = emailEl.value.trim().toLowerCase();

    if (!name) { showError('Please enter your name.'); nameEl.focus(); return; }
    if (!email || !email.includes('@') || !email.includes('.')) {
      showError('Please enter a valid email.');
      emailEl.focus();
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Saving…';

    const userId = makeUserId(email);

    try {
      await saveUser(userId, { email, name });
      setCurrentUser({ userId, email, name });
      window.location.href = 'index.html';
    } catch (e) {
      console.error('Save failed:', e);
      showError('Could not save. Check your connection and try again.');
      btn.disabled = false;
      btn.textContent = 'Continue →';
    }
  });

  // Enter key submits
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') btn.click();
  });
</script>
</body>
</html>
