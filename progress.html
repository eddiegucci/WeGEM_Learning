<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progress — WeGEM Learning</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="nav">
  <a href="home.html" class="logo"><span class="logo-dot"></span> WeGEM Learning</a>
  <div class="nav-links">
    <a href="home.html">Home</a>
    <a href="notes.html">Notes</a>
    <a href="exams.html">Exams</a>
    <a href="quiz.html">Practice</a>
    <a href="progress.html" class="active">Progress</a>
    <a id="auth-link" href="signup.html">Sign Out</a>
  </div>
</nav>

<main class="container">
  <div class="section-label">Your dashboard</div>
  <h1 class="section-title">Progress</h1>
  <p class="section-sub">All your stats in one place.</p>

  <div class="stats-bar">
    <div>
      <div class="stat-value" id="pStreak">0</div>
      <div class="stat-label">Day streak</div>
    </div>
    <div>
      <div class="stat-value" id="pQuizzes">0</div>
      <div class="stat-label">Quizzes taken</div>
    </div>
    <div>
      <div class="stat-value" id="pAvg">0%</div>
      <div class="stat-label">Average score</div>
    </div>
    <div>
      <div class="stat-value" id="pTopics">0</div>
      <div class="stat-label">Topics attempted</div>
    </div>
  </div>

  <h2 class="section-title" style="margin-top:60px;">Topic performance</h2>
  <div id="topicList" class="topic-list"></div>

  <h2 class="section-title" style="margin-top:60px;">Recent attempts</h2>
  <div id="historyList" class="history-list"></div>

  <div style="margin-top:40px;">
    <button class="btn btn-ghost" id="resetBtn">Reset all data</button>
  </div>
</main>

<footer class="footer">WeGEM Learning · Interactive exam prep for Kenya</footer>

<script type="module" src="js/progress.js"></script>
</body>
</html>
